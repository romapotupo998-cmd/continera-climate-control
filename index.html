
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111">
 <link rel="manifest" href="manifest.json">
<title>Continera Climate Control</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
 margin:0;min-height:100vh;background:#111315;
 display:flex;align-items:center;justify-content:center;
 padding:18px;font-family:Arial,sans-serif;color:white
}
.panel{
 width:100%;max-width:390px;background:#25292b;
 padding:19px;border-radius:15px;
 box-shadow:0 15px 40px #000;
 border:2px solid #414648
}
.brand{text-align:center;color:#aaa;font-size:12px;letter-spacing:4px}
.heading{text-align:center;font-size:12px;color:#777;margin:7px 0 22px}
.climate{
 background:#111416;border-radius:9px;padding:12px;
 border:1px solid #454a4c;
 box-shadow:inset 0 2px 10px #000;
}
.temp-display{
 height:35px;display:flex;align-items:center;
 justify-content:center;gap:12px;
 font-size:24px;color:#e5f0f0;
 text-shadow:0 0 8px #a9d9d5
}
.temp-display button{
 width:60px;height:27px;border:0;
 background:#222729;color:#ddd;border-radius:5px;
 font-size:17px
}
.temp-display span{min-width:80px;text-align:center}
.controls{
 margin-top:8px;background:#171a1c;
 border:1px solid #3e4446;border-radius:11px;
 padding:9px;display:grid;
 grid-template-columns:48px 1fr 48px;
 gap:5px;align-items:stretch
}
.side{display:flex;flex-direction:column;gap:5px}
button{
 cursor:pointer;color:#e6e8e8;
 background:linear-gradient(#343a3d,#202426);
 border:1px solid #101314;border-radius:6px;
 min-height:43px;font-size:17px;
 box-shadow:0 2px 3px #080909;
 touch-action:manipulation
}
button:active{filter:brightness(1.5)}
button.active{
 color:#8df0bd;
 text-shadow:0 0 8px #56d99c;
 background:linear-gradient(#35423e,#202c29);
}
.side button{font-size:19px}
.side small{font-size:9px;display:block;color:#aaa}
.center{
 display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:5px
}
.dial{
 width:112px;height:112px;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#606669,#24292c 62%,#111);
 border:5px solid #555d60;
 box-shadow:0 0 0 2px #111,0 3px 7px #000;
 display:flex;flex-direction:column;overflow:hidden;
}
.dial button{
 flex:1;border:0;border-radius:0;
 background:transparent;box-shadow:none;
 font-size:20px;min-height:0
}
.dial button+button{border-top:1px solid #555}
.dial button.active{color:#83e9b4}
.dial-label{font-size:9px;color:#999;letter-spacing:1px}
.silver{
 display:grid;grid-template-columns:1fr 1fr;
 margin-top:10px;gap:7px
}
.silver button{
 border-radius:22px;
 background:linear-gradient(#d1d0c8,#777873);
 color:#303432;font-size:18px;
 border:1px solid #666;
 min-height:42px
}
.silver button.active{
 background:linear-gradient(#c6e7d5,#6fae8b);
 color:#153c2c
}
.status{
 margin-top:13px;background:#111516;
 border:1px solid #3b4244;border-radius:7px;
 padding:10px;text-align:center;
 font-size:11px;color:#9cb7ae;
 letter-spacing:1px
}
.power{
 margin-top:12px;width:100%;height:43px;
 font-size:12px;letter-spacing:2px
}
.power.off{background:#692d2d}
.footer{text-align:center;font-size:9px;
 color:#697174;margin-top:17px;letter-spacing:2px}
button:disabled{opacity:.3}
</style>
</head>
<body>
<div class="panel">
 <div class="brand">DAF</div>
 <div class="heading">CLIMATE CONTROL SYSTEM</div>

 <div class="climate">
  <div class="temp-display">
   <button id="minusTemp">−</button>
   <span id="temperature">21.0°C</span>
   <button id="plusTemp">+</button>
  </div>

  <div class="controls">
   <div class="side">
    <button id="recirc" title="Рециркуляція">♻<small>RECIRC</small></button>
    <button id="defrost" title="Обдув скла">▱<small>GLASS</small></button>
    <button id="heater" title="Додатковий обігрів">P<small>HEAT</small></button>
   </div>

   <div class="center">
    <div class="dial">
     <button id="fanUp" title="Збільшити швидкість">✿</button>
     <button id="fanDown" title="Зменшити швидкість">✿</button>
    </div>
    <div class="dial-label">FAN SPEED <span id="fan">3</span></div>
   </div>

   <div class="side">
    <button data-air="upper">↗<small>UPPER</small></button>
    <button data-air="middle">➜<small>MIDDLE</small></button>
    <button data-air="lower">↘<small>LOWER</small></button>
   </div>
  </div>

  <div class="silver">
   <button id="ac">❄</button>
   <button id="auto">AUTO</button>
  </div>
 </div>

 <div class="status" id="status">CLIMATE SYSTEM READY</div>
 <button class="power" id="power">⏻ CLIMATE ON</button>
 <div class="footer">CONTINERA • DAF XG+</div>
</div>


<script>
const STORAGE_KEY = "contineraClimateSettings";

const defaults = {
 power:true,
 temp:21,
 fan:3,
 air:"middle",
 ac:false,
 auto:false,
 recirc:false,
 defrost:false,
 heater:false
};

function loadSettings(){
 try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if(!saved) return {...defaults};

  const data = JSON.parse(saved);

  return {
   ...defaults,
   ...data,
   temp: Number.isFinite(data.temp) ? Math.min(30,Math.max(16,data.temp)) : defaults.temp,
   fan: Number.isInteger(data.fan) ? Math.min(7,Math.max(0,data.fan)) : defaults.fan,
   air: ["upper","middle","lower"].includes(data.air) ? data.air : defaults.air
  };
 } catch(error) {
  return {...defaults};
 }
}

const s = loadSettings();

const $ = id => document.getElementById(id);

function saveSettings(){
 try {
  localStorage.setItem(STORAGE_KEY,JSON.stringify(s));
 } catch(error) {
  console.error("Не вдалося зберегти налаштування:",error);
 }
}

function manual(){
 s.auto=false;
 s.defrost=false;
}

function render(){
 $("temperature").textContent=s.temp.toFixed(1)+"°C";
 $("fan").textContent=s.fan;

 $("ac").classList.toggle("active",s.ac);
 $("auto").classList.toggle("active",s.auto);
 $("recirc").classList.toggle("active",s.recirc);
 $("defrost").classList.toggle("active",s.defrost);
 $("heater").classList.toggle("active",s.heater);

 document.querySelectorAll("[data-air]").forEach(b=>{
  b.classList.toggle("active",b.dataset.air===s.air);
 });

 $("fanUp").classList.toggle("active",s.fan>0);
 $("fanDown").classList.toggle("active",s.fan===0);

 $("status").textContent=!s.power?"SYSTEM OFF":
  s.defrost?"WINDSCREEN DEFROST":
  s.auto?"AUTOMATIC CLIMATE":
  "MANUAL CLIMATE";

 $("power").textContent=s.power?"⏻ CLIMATE ON":"⏻ CLIMATE OFF";
 $("power").classList.toggle("off",!s.power);

 document.querySelectorAll(".panel button:not(#power)").forEach(b=>{
  b.disabled=!s.power;
 });

 saveSettings();
}

$("plusTemp").onclick=()=>{
 if(s.temp<30){s.temp+=0.5;manual();render()}
};

$("minusTemp").onclick=()=>{
 if(s.temp>16){s.temp-=0.5;manual();render()}
};

$("fanUp").onclick=()=>{
 s.fan=Math.min(7,s.fan+1);
 manual();
 render();
};

$("fanDown").onclick=()=>{
 s.fan=Math.max(0,s.fan-1);
 manual();
 render();
};

document.querySelectorAll("[data-air]").forEach(b=>{
 b.onclick=()=>{
  s.air=b.dataset.air;
  manual();
  render();
 };
});

$("ac").onclick=()=>{
 s.ac=!s.ac;
 manual();
 render();
};

$("recirc").onclick=()=>{
 s.recirc=!s.recirc;
 manual();
 render();
};

$("heater").onclick=()=>{
 s.heater=!s.heater;
 manual();
 render();
};

$("defrost").onclick=()=>{
 s.defrost=!s.defrost;

 if(s.defrost){
  s.fan=7;
  s.air="upper";
  s.recirc=false;
  s.auto=false;
 }

 render();
};

$("auto").onclick=()=>{
 s.auto=!s.auto;
 s.defrost=false;

 if(s.auto){
  s.fan=3;
  s.air="middle";
 }

 render();
};

$("power").onclick=()=>{
 s.power=!s.power;
 render();
};

// Зберігаємо налаштування перед закриттям сторінки
window.addEventListener("pagehide",saveSettings);

render();
</script>

 <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(error => console.error("SW:", error));
  });
}
 </script>
</body>
</html>
